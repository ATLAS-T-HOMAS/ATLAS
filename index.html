<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="ATLAS transforma tus preguntas sobre el mundo en caminos para comprender, conectar y actuar."
  >

  <title>ATLAS · De tu pregunta al mapa de respuestas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main>

    <section class="hero">

      <div class="container">

        <div class="logo">
          ATLAS
        </div>

        <p class="subtitle">
          De tu pregunta al mapa de respuestas.
        </p>

        <div class="search">

          <input
            id="question"
            type="text"
            placeholder="¿Qué quieres entender del mundo?"
            aria-label="Escribe una pregunta sobre el mundo"
            autocomplete="off"
          >

          <button
            id="searchButton"
            type="button"
          >
            Explorar
          </button>

        </div>

        <div class="quick">

          <div>🌍 Pobreza</div>

          <div>🌱 Deforestación</div>

          <div>🤝 Soledad</div>

          <div>📚 Educación</div>

          <div>🕊️ Conflictos</div>

          <div>💙 Salud mental</div>

        </div>

      </div>

    </section>

  </main>

  <footer>
    ATLAS · Comprender · Conectar · Actuar
  </footer>

  <script src="js/app.js"></script>

</body>
</html>
