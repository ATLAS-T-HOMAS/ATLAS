<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATLAS</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,Arial,sans-serif;
}

body{
background:#07111F;
color:white;
overflow:hidden;
}

.hero{

height:100vh;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

background:
linear-gradient(rgba(7,17,31,.80),rgba(7,17,31,.95)),
url("https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=1600&q=80");

background-size:cover;
background-position:center;

text-align:center;
padding:40px;

}

h1{

font-size:90px;
letter-spacing:8px;

}

p{

margin-top:20px;

font-size:26px;

color:#d5dbe5;

max-width:900px;

}

input{

margin-top:50px;

width:700px;
max-width:90%;

padding:22px;

border:none;

border-radius:50px;

font-size:22px;

outline:none;

}

button{

margin-top:25px;

padding:18px 40px;

font-size:20px;

border:none;

border-radius:50px;

background:#5D7CFA;

color:white;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:scale(1.05);

}

footer{

position:absolute;

bottom:25px;

width:100%;

text-align:center;

color:#AAB3C5;

font-size:15px;

}
</style>

</head>

<body>

<section class="hero">

<h1>ATLAS</h1>

<p>

De tu pregunta al mapa de respuestas.

</p>

<input
placeholder="¿Qué quieres entender del mundo?">

<button>

Comenzar

</button>

</section>

<footer>

ATLAS © 2026 · Comprender · Conectar · Actuar

</footer>

</body>

</html>
